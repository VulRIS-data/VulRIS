[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulris"
version = "2.1.0"
description = "Multi-language structured source-code relation index for repository analysis"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["security", "static-analysis", "source-code", "tree-sitter", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-c-sharp>=0.23,<0.24",
  "tree-sitter-c>=0.24,<0.25",
  "tree-sitter-cpp>=0.23,<0.24",
  "tree-sitter-rust>=0.24,<0.25",
  "tree-sitter-php>=0.25,<0.26",
  "tree-sitter-ruby>=0.23,<0.24",
  "tree-sitter-kotlin>=1.1,<1.2",
  "tree-sitter-swift>=0.7,<0.8",
  "pathspec>=0.12,<1",
]

[project.scripts]
vulris = "relation_index.cli:main"

[project.urls]
Homepage = "https://github.com/VulRIS-data/VulRIS"
Repository = "https://github.com/VulRIS-data/VulRIS.git"
Issues = "https://github.com/VulRIS-data/VulRIS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relation_index = ["py.typed"]
