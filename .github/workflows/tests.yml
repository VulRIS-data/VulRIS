name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run --no-sync python -m unittest discover -s tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag vulris:test .
      - name: Smoke-test CLI and persistent index
        run: |
          docker volume create vulris-ci-data
          docker run --rm vulris:test --version
          docker run --rm \
            --mount type=bind,src="$PWD/tests/fixture",dst=/source,readonly \
            --mount type=volume,src=vulris-ci-data,dst=/data \
            vulris:test --data-dir /data --project /source build
          docker run --rm \
            --mount type=bind,src="$PWD/tests/fixture",dst=/source,readonly \
            --mount type=volume,src=vulris-ci-data,dst=/data \
            vulris:test --data-dir /data --project /source overview
          docker volume rm vulris-ci-data
